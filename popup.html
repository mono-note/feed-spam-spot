<!doctype html>
<meta charset="utf-8">
<title>Feed Spam Spotter</title>
<style>
  :root { --bg:#fff; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --ok:#16a34a; --field:#f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --fg:#f1f5f9; --muted:#94a3b8; --line:#334155; --accent:#3b82f6; --ok:#4ade80; --field:#1e293b; }
  }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  header img { width: 32px; height: 32px; border-radius: 8px; }
  h1 { margin: 0; font-size: 16px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; align-items: center; margin-bottom: 14px; }
  .row label { margin: 0; }
  .field { position: relative; }
  input { width: 100%; padding: 10px 40px 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--fg); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  #eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; cursor: pointer; font-size: 16px; opacity: .6; }
  #eye:hover { opacity: 1; }
  #save { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 600 14px system-ui; cursor: pointer; transition: filter .15s, transform .05s; }
  #save:hover { filter: brightness(1.1); }
  #save:active { transform: scale(.98); }
  #status { min-height: 18px; margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #enabled-state { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  input[role=switch] { appearance: none; flex-shrink: 0; align-self: flex-start; width: 44px; height: 26px; padding: 3px; margin: 0 0 0 auto; border: 0; border-radius: 20px; background: var(--muted); cursor: pointer; }
  input[role=switch]::before { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  input[role=switch]:checked { background: var(--accent); }
  input[role=switch]:checked::before { transform: translateX(18px); }
  input[role=switch]:disabled { opacity: .5; cursor: wait; }
</style>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div><h1>Feed Spam Spotter</h1><p>Powered by TypeSafe Jev</p></div>
    <input id="enabled" type="checkbox" role="switch" disabled aria-label="เปิดใช้งานการตรวจจับ" aria-describedby="enabled-state">
  </header>
  <div id="enabled-state" aria-live="polite">กำลังโหลด…</div>
  <div class="row"><label for="mode">ซ่อนโฆษณาไปเลย</label><input id="mode" type="checkbox" role="switch"></div>
  <label for="key">API key</label>
  <div class="field">
    <input id="key" type="text" class="masked" placeholder="ts_..." autocomplete="off" autofocus spellcheck="false">
    <button id="eye" type="button" title="Show / hide">👁</button>
  </div>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
